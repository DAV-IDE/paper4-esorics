name: Reproduce Paper 4
on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: make all
      - run: |
          git diff --exit-code --ignore-blank-lines --ignore-space-at-eol tables/ || \
            (echo "ERROR: regenerated LaTeX tables differ from committed ones!"; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-artefacts
          path: |
            tables/
            figures/
            results/
