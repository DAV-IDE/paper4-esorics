name: Reproduce Paper 4
on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: make all
      - name: Verify deterministic table matches (real_data.tex)
        run: |
          # real_data.tex is fully deterministic (seed=20260606) and must
          # match bit-for-bit up to whitespace.
          git diff --exit-code --ignore-blank-lines --ignore-space-at-eol tables/real_data.tex || \
            (echo "ERROR: regenerated tables/real_data.tex differs from committed!"; exit 1)
      - name: Verify SPARQL table structure (latencies are hardware-dependent)
        run: |
          # tables/sparql_scaling.tex latencies vary with runner hardware
          # (see REPRODUCIBILITY.md Stage E, ±20% tolerance). Verify only
          # structural fields: bindings and triple counts, which are
          # deterministic under fixed seed.
          python - <<'PY'
          import re, sys
          with open('tables/sparql_scaling.tex') as f:
              body = f.read()
          # Extract every numeric cell; check bindings/triple counts against
          # the canonical values from results/sparql/sparql_scaling_summary.json.
          expected_bindings = {'34', '13', '321', '110', '1,543', '505'}
          expected_triples = {'964', '9,452', '47,032'}
          missing = [v for v in (expected_bindings | expected_triples) if v not in body]
          if missing:
              print(f'ERROR: sparql_scaling.tex missing expected deterministic values: {missing}')
              sys.exit(1)
          print('OK: sparql_scaling.tex contains all expected bindings and triple counts.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-artefacts
          path: |
            tables/
            figures/
            results/
